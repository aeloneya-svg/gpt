<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoRift Play Now (3D)</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#090f1f; color:#eaf0ff; font-family:system-ui,sans-serif; }
    #wrap { display:grid; grid-template-columns:320px 1fr; height:100%; }
    #hud { background:#101a36; border-right:1px solid #2b3a63; padding:14px; }
    #hud h1 { margin:0 0 8px; font-size:18px; }
    #hud p, #hud li { font-size:13px; line-height:1.35; }
    .card { background:#18264d; border-radius:10px; padding:8px; margin:8px 0; }
    #game { width:100%; height:100%; display:block; }
    .ok { color:#89f7ad; }
  </style>
</head>
<body>
<div id="wrap">
  <aside id="hud">
    <h1>EchoRift — 3D Play Now</h1>
    <p class="ok">3D arena demo: Rift Skirmish loop in browser.</p>
    <div id="status" class="card"></div>
    <div id="rift" class="card"></div>
    <div id="score" class="card"></div>
    <p><b>Controls</b></p>
    <ul>
      <li>Move: WASD</li>
      <li>Look: ← / →</li>
      <li>Shoot: Space</li>
      <li>Build block in front: B</li>
      <li>Restart after end: Enter</li>
    </ul>
  </aside>
  <canvas id="game" width="1365" height="768"></canvas>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const riftEl = document.getElementById('rift');
  const scoreEl = document.getElementById('score');

  const rifts = [
    { name:'LOW_GRAVITY', playerSpeed:1.20, enemySpeed:0.85, bulletSpeed:1.0, wallArmor:1.0, color:'#77c8ff' },
    { name:'SPEED_SURGE', playerSpeed:1.35, enemySpeed:1.25, bulletSpeed:1.15, wallArmor:1.0, color:'#ffe48a' },
    { name:'FORTIFIED_BUILDS', playerSpeed:1.0, enemySpeed:1.0, bulletSpeed:1.0, wallArmor:2.2, color:'#94ffb2' },
    { name:'CHAOS_OVERCHARGE', playerSpeed:1.15, enemySpeed:1.35, bulletSpeed:1.35, wallArmor:0.85, color:'#ff9ecf' }
  ];

  const state = {
    keys:new Set(),
    player:null,
    enemies:[],
    bullets:[],
    builds:[],
    loot:[],
    score:0,
    craft:0,
    built:0,
    t0:0,
    duration:150,
    ended:false,
    arena:48,
  };

  function reset(){
    state.player = {x:0,z:0,yaw:0,hp:100,speed:8};
    state.enemies=[]; state.bullets=[]; state.builds=[]; state.loot=[];
    state.score=0; state.craft=0; state.built=0;
    state.t0=performance.now(); state.ended=false;
    spawnEnemies(12);
  }

  function spawnEnemies(n){
    for(let i=0;i<n;i++){
      const ang=Math.random()*Math.PI*2;
      const rad=20+Math.random()*20;
      state.enemies.push({x:Math.cos(ang)*rad,z:Math.sin(ang)*rad,hp:45,r:1.1,speed:3.5+Math.random()*1.4});
    }
  }

  function curRift(){
    const elapsed=(performance.now()-state.t0)/1000;
    const idx=Math.min(rifts.length-1,Math.floor(elapsed/35));
    return rifts[idx];
  }

  function tryBuild(){
    if(state.ended) return;
    const fx=state.player.x+Math.cos(state.player.yaw)*3.2;
    const fz=state.player.z+Math.sin(state.player.yaw)*3.2;
    if(Math.abs(fx)>state.arena-2||Math.abs(fz)>state.arena-2) return;
    const tooClose=state.builds.some(b=>Math.hypot(b.x-fx,b.z-fz)<2.2);
    if(tooClose) return;
    const rift=curRift();
    state.builds.push({x:fx,z:fz,w:2,h:2,d:2,hp:80*rift.wallArmor});
    state.built++;
  }

  function shoot(){
    if(state.ended) return;
    const rift=curRift();
    const speed=20*rift.bulletSpeed;
    state.bullets.push({x:state.player.x,z:state.player.z,vx:Math.cos(state.player.yaw)*speed,vz:Math.sin(state.player.yaw)*speed,ttl:1.8});
  }

  function lineBlocked(x1,z1,x2,z2){
    for(const b of state.builds){
      // segment-AABB coarse check
      const minX=b.x-b.w/2,maxX=b.x+b.w/2,minZ=b.z-b.d/2,maxZ=b.z+b.d/2;
      for(let t=0;t<=1;t+=0.08){
        const x=x1+(x2-x1)*t, z=z1+(z2-z1)*t;
        if(x>minX&&x<maxX&&z>minZ&&z<maxZ) return b;
      }
    }
    return null;
  }

  function update(dt){
    const elapsed=(performance.now()-state.t0)/1000;
    const left=Math.max(0,state.duration-elapsed);
    const rift=curRift();
    if(left<=0||state.player.hp<=0) state.ended=true;

    if(!state.ended){
      let f=0,s=0;
      if(state.keys.has('w')) f+=1;
      if(state.keys.has('s')) f-=1;
      if(state.keys.has('a')) s-=1;
      if(state.keys.has('d')) s+=1;
      if(state.keys.has('arrowleft')) state.player.yaw-=1.9*dt;
      if(state.keys.has('arrowright')) state.player.yaw+=1.9*dt;

      const c=Math.cos(state.player.yaw), si=Math.sin(state.player.yaw);
      const mvx=(c*f + -si*s)*state.player.speed*rift.playerSpeed;
      const mvz=(si*f + c*s)*state.player.speed*rift.playerSpeed;
      state.player.x=Math.max(-state.arena,Math.min(state.arena,state.player.x+mvx*dt));
      state.player.z=Math.max(-state.arena,Math.min(state.arena,state.player.z+mvz*dt));

      for(const b of state.bullets){ b.x+=b.vx*dt; b.z+=b.vz*dt; b.ttl-=dt; }
      state.bullets=state.bullets.filter(b=>b.ttl>0&&Math.abs(b.x)<state.arena+5&&Math.abs(b.z)<state.arena+5);

      for(const e of state.enemies){
        const block=lineBlocked(e.x,e.z,state.player.x,state.player.z);
        let tx=state.player.x,tz=state.player.z;
        if(block){ tx=block.x; tz=block.z; }
        const ang=Math.atan2(tz-e.z,tx-e.x);
        const ex=e.x+Math.cos(ang)*e.speed*rift.enemySpeed*dt;
        const ez=e.z+Math.sin(ang)*e.speed*rift.enemySpeed*dt;
        const collision=state.builds.find(b=>Math.abs(ex-b.x)<(b.w/2+0.8)&&Math.abs(ez-b.z)<(b.d/2+0.8));
        if(collision){ collision.hp-=16*dt/(rift.wallArmor); }
        else { e.x=ex; e.z=ez; }
      }
      state.builds=state.builds.filter(b=>b.hp>0);

      for(const b of state.bullets){
        const hitBlock=state.builds.find(w=>Math.abs(b.x-w.x)<w.w/2&&Math.abs(b.z-w.z)<w.d/2);
        if(hitBlock){ b.ttl=0; continue; }
        for(const e of state.enemies){
          if(Math.hypot(b.x-e.x,b.z-e.z)<1.2){
            e.hp-=24; b.ttl=0;
            if(e.hp<=0){ state.score+=30; state.loot.push({x:e.x,z:e.z,ttl:12}); }
            break;
          }
        }
      }
      state.enemies=state.enemies.filter(e=>e.hp>0);

      for(const e of state.enemies){
        if(Math.hypot(e.x-state.player.x,e.z-state.player.z)<1.6){ state.player.hp-=22*dt; }
      }

      for(const l of state.loot){
        l.ttl-=dt;
        if(Math.hypot(l.x-state.player.x,l.z-state.player.z)<1.4){ l.ttl=0; state.craft++; state.score+=8; }
      }
      state.loot=state.loot.filter(l=>l.ttl>0);

      if(state.enemies.length<7) spawnEnemies(3);
    }

    statusEl.textContent = state.ended
      ? `Match ended — ${state.player.hp>0?'Extracted':'Downed'} | Press Enter to restart`
      : `Time: ${Math.ceil(left)}s | HP: ${Math.max(0,Math.round(state.player.hp))}`;
    riftEl.textContent = `Rift: ${rift.name} | Effects: player x${rift.playerSpeed.toFixed(2)}, enemy x${rift.enemySpeed.toFixed(2)}, wall armor x${rift.wallArmor.toFixed(2)}`;
    scoreEl.textContent = `Score ${state.score} | Built ${state.built} | Craft ${state.craft} | Enemies ${state.enemies.length}`;
  }

  function project(wx,wz,wy=0){
    const dx=wx-state.player.x, dz=wz-state.player.z;
    const c=Math.cos(-state.player.yaw), s=Math.sin(-state.player.yaw);
    const cx=dx*c - dz*s;
    const cz=dx*s + dz*c;
    if(cz<0.2) return null;
    const f=420/cz;
    return { x:canvas.width/2 + cx*f, y:canvas.height*0.62 - wy*f, s:f };
  }

  function drawFloor(){
    ctx.fillStyle='#0a1126';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let i=-state.arena;i<=state.arena;i+=2){
      drawLine3D(-state.arena,i,0,state.arena,i,0,'#1a2a52');
      drawLine3D(i,-state.arena,0,i,state.arena,0,'#1a2a52');
    }
    drawLine3D(-state.arena,-state.arena,0,-state.arena,state.arena,0,'#3a4d82');
    drawLine3D(state.arena,-state.arena,0,state.arena,state.arena,0,'#3a4d82');
    drawLine3D(-state.arena,-state.arena,0,state.arena,-state.arena,0,'#3a4d82');
    drawLine3D(-state.arena,state.arena,0,state.arena,state.arena,0,'#3a4d82');
  }

  function drawLine3D(x1,z1,y1,x2,z2,y2,col){
    const a=project(x1,z1,y1), b=project(x2,z2,y2);
    if(!a||!b) return;
    ctx.strokeStyle=col; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }

  function drawCube(x,z,w,h,d,color){
    const p=[
      project(x-w/2,z-d/2,0), project(x+w/2,z-d/2,0), project(x+w/2,z+d/2,0), project(x-w/2,z+d/2,0),
      project(x-w/2,z-d/2,h), project(x+w/2,z-d/2,h), project(x+w/2,z+d/2,h), project(x-w/2,z+d/2,h)
    ];
    if(p.some(v=>!v)) return;
    ctx.fillStyle=color;
    ctx.globalAlpha=0.9;
    // top
    ctx.beginPath(); ctx.moveTo(p[4].x,p[4].y); ctx.lineTo(p[5].x,p[5].y); ctx.lineTo(p[6].x,p[6].y); ctx.lineTo(p[7].x,p[7].y); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=0.7;
    // sides
    ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y); ctx.lineTo(p[1].x,p[1].y); ctx.lineTo(p[5].x,p[5].y); ctx.lineTo(p[4].x,p[4].y); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(p[1].x,p[1].y); ctx.lineTo(p[2].x,p[2].y); ctx.lineTo(p[6].x,p[6].y); ctx.lineTo(p[5].x,p[5].y); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
  }

  function draw(){
    drawFloor();

    const rift=curRift();
    const r=project(18,0,0);
    if(r){ ctx.fillStyle=rift.color+'33'; ctx.beginPath(); ctx.arc(r.x,r.y,Math.max(24,160/r.s),0,Math.PI*2); ctx.fill(); }

    for(const b of state.builds) drawCube(b.x,b.z,b.w,b.h,b.d,'#57a0ff');
    for(const l of state.loot) drawCube(l.x,l.z,0.5,0.5,0.5,'#ffd36b');
    for(const e of state.enemies) drawCube(e.x,e.z,1.2,1.6,1.2,'#ff6f86');

    for(const b of state.bullets){
      const p=project(b.x,b.z,0.7); if(!p) continue;
      ctx.fillStyle='#eaf2ff'; ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(1,3*p.s/120),0,Math.PI*2); ctx.fill();
    }

    // crosshair
    ctx.strokeStyle='#d9e6ff';
    ctx.beginPath(); ctx.moveTo(canvas.width/2-8,canvas.height/2); ctx.lineTo(canvas.width/2+8,canvas.height/2); ctx.moveTo(canvas.width/2,canvas.height/2-8); ctx.lineTo(canvas.width/2,canvas.height/2+8); ctx.stroke();
  }

  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    state.keys.add(k);
    if(k===' ') shoot();
    if(k==='b') tryBuild();
    if(e.key==='Enter'&&state.ended) reset();
  });
  window.addEventListener('keyup',e=>state.keys.delete(e.key.toLowerCase()));

  let last=performance.now();
  function loop(now){
    const dt=Math.min(0.033,(now-last)/1000); last=now;
    update(dt); draw(); requestAnimationFrame(loop);
  }

  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
