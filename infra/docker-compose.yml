version: '3.9'
services:
  backend:
    build:
      context: ../backend
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - JWT_SECRET=dev-secret
      - DATABASE_URL=postgres://echorift:echorift@postgres:5432/echorift
      - MATCH_DURATION_SECONDS=480
      - RIFT_ROTATION_SECONDS=180
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: echorift
      POSTGRES_PASSWORD: echorift
      POSTGRES_DB: echorift
    ports:
      - '5432:5432'
    volumes:
      - ../backend/scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../backend/scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
  redis:
    image: redis:7
    ports:
      - '6379:6379'
